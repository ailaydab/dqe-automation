[pytest]
# marks
# python_files
python_files = test_*.py
# addopts
markers = 
    validate_csv: Marks tests that validate CSV file 
    unmarked: Marks tests that are unmarked
addopts = --html=report.html
rp_endpoint = https://reportportal.epam.com
rp_project = asliilayda_barut_personal
rp_launch = Pytest_Intro_CSV
rp_launch_attributes = env:dev type:regression
rp_log_batch_size = 20
log_cli = true
log_cli_level = INFO
